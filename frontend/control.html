<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control IoT - Examen Tema 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh;
        }
        .card { 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            margin-bottom: 20px;
        }
        .btn-control { 
            font-size: 1.1rem; 
            padding: 15px; 
            margin: 5px; 
            border-radius: 10px; 
            transition: all 0.3s; 
            border: none;
        }
        .btn-control:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }
        .evento { 
            border-left: 4px solid #007bff; 
            background: white; 
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .log-container { 
            height: 300px; 
            overflow-y: auto; 
            background: #f8f9fa; 
            border-radius: 10px; 
            padding: 15px;
        }
        .navbar {
            border-radius: 0 0 15px 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-robot"></i> Control IoT - Examen Tema 2
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">
                    <i class="fas fa-home"></i> Inicio
                </a>
                <a class="nav-link" href="monitoreo.html">
                    <i class="fas fa-chart-line"></i> Monitoreo
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Estado de Conexión -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <h5><i class="fas fa-server"></i> Backend</h5>
                                <div class="alert alert-success" id="estadoBackend">
                                    <i class="fas fa-spinner fa-spin"></i> Conectando...
                                </div>
                            </div>
                            <div class="col-md-4">
                                <h5><i class="fas fa-plug"></i> WebSockets</h5>
                                <div class="alert alert-warning" id="estadoWebSocket">
                                    <i class="fas fa-spinner fa-spin"></i> Conectando...
                                </div>
                            </div>
                            <div class="col-md-4">
                                <h5><i class="fas fa-database"></i> Base de Datos</h5>
                                <div class="alert alert-info" id="estadoBD">
                                    <i class="fas fa-spinner fa-spin"></i> Verificando...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controles -->
        <div class="row">
            <!-- Control de Movimiento -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-gamepad"></i> Control de Movimiento</h4>
                    </div>
                    <div class="card-body text-center">
                        <!-- Fila Superior: Adelante -->
                        <div class="row mb-2">
                            <div class="col-12">
                                <button class="btn btn-success btn-control w-100" onclick="enviarComando('movimiento', 'adelante')">
                                    <i class="fas fa-arrow-up"></i><br>Adelante
                                </button>
                            </div>
                        </div>
                        
                        <!-- Fila Media: Izquierda y Derecha -->
                        <div class="row mb-2">
                            <div class="col-6">
                                <button class="btn btn-primary btn-control w-100" onclick="enviarComando('movimiento', 'izquierda')">
                                    <i class="fas fa-arrow-left"></i><br>Izquierda
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-primary btn-control w-100" onclick="enviarComando('movimiento', 'derecha')">
                                    <i class="fas fa-arrow-right"></i><br>Derecha
                                </button>
                            </div>
                        </div>
                        
                        <!-- Fila Inferior: Atrás y Detener -->
                        <div class="row mb-2">
                            <div class="col-6">
                                <button class="btn btn-warning btn-control w-100" onclick="enviarComando('movimiento', 'atras')">
                                    <i class="fas fa-arrow-down"></i><br>Atrás
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-danger btn-control w-100" onclick="enviarComando('movimiento', 'detener')">
                                    <i class="fas fa-stop"></i><br>Detener
                                </button>
                            </div>
                        </div>

                        <!-- Fila Giros: 90° y 360° -->
                        <div class="row">
                            <div class="col-6">
                                <button class="btn btn-info btn-control w-100" onclick="enviarComando('movimiento', 'giro_90')">
                                    <i class="fas fa-redo-alt"></i><br>Giro 90°
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-info btn-control w-100" onclick="enviarComando('movimiento', 'giro_360')">
                                    <i class="fas fa-sync-alt"></i><br>Giro 360°
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Secuencias y Obstáculos -->
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="fas fa-cogs"></i> Secuencias y Sensores</h4>
                    </div>
                    <div class="card-body text-center">
                        <!-- Secuencias Demo -->
                        <h5><i class="fas fa-play-circle"></i> Secuencias Demo</h5>
                        <div class="row mb-3">
                            <div class="col-6">
                                <button class="btn btn-info btn-control w-100" onclick="enviarComando('demo', 1)">
                                    <i class="fas fa-route"></i><br>Demo 1
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-info btn-control w-100" onclick="enviarComando('demo', 2)">
                                    <i class="fas fa-project-diagram"></i><br>Demo 2
                                </button>
                            </div>
                        </div>

                        <!-- Obstáculos -->
                        <h5><i class="fas fa-exclamation-triangle"></i> Detección de Obstáculos</h5>
                        <div class="row">
                            <div class="col-12">
                                <button class="btn btn-warning btn-control w-100" onclick="simularObstaculo()">
                                    <i class="fas fa-radar"></i><br>Simular Obstáculo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log de Eventos -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0"><i class="fas fa-list-alt"></i> Log de Eventos en Tiempo Real</h4>
                    </div>
                    <div class="card-body">
                        <div id="logEventos" class="log-container">
                            <div class="text-center text-muted">
                                <i class="fas fa-clock"></i> Esperando eventos...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:5500');
        let dispositivoId = 1;

        // ==================== WEBSOCKET EVENTS ====================
        socket.on('connect', () => {
            document.getElementById('estadoWebSocket').innerHTML = 
                '<i class="fas fa-check-circle"></i> <strong>CONECTADO</strong> - WebSockets activos';
            agregarLog('🔌 WebSocket: Conexión establecida con el servidor');
            verificarBackend();
        });

        socket.on('movimiento_controlado', (data) => {
            console.log('📡 Evento recibido en CONTROL:', data);
            let icono = '🚗';
            if (data.tipo_movimiento.includes('giro')) {
                icono = '🔄';
            }
            agregarLog(`${icono} MOVIMIENTO: ${data.tipo_movimiento.toUpperCase()} - Dispositivo ${data.dispositivo_id}`);
        });

        socket.on('obstaculo_detectado', (data) => {
            console.log('📡 Evento recibido en CONTROL:', data);
            agregarLog(`🚨 OBSTÁCULO: ${data.distancia}cm - Dispositivo ${data.dispositivo_id}`);
        });

        socket.on('demo_ejecutada', (data) => {
            console.log('📡 Evento recibido en CONTROL:', data);
            agregarLog(`🤖 DEMO: Secuencia ${data.secuencia_id} - Dispositivo ${data.dispositivo_id}`);
        });

        socket.on('disconnect', () => {
            document.getElementById('estadoWebSocket').innerHTML = 
                '<i class="fas fa-times-circle"></i> <strong>DESCONECTADO</strong>';
            agregarLog('❌ WebSocket: Conexión perdida');
        });

        // ==================== FUNCIONES PRINCIPALES ====================
        async function enviarComando(tipo, valor) {
            let url = '';
            let body = { dispositivo_id: dispositivoId };

            if (tipo === 'movimiento') {
                url = '/api/control/movimiento';
                body.tipo_movimiento = valor;
            } else if (tipo === 'obstaculo') {
                url = '/api/control/obstaculo';
                body.distancia = valor;
            } else if (tipo === 'demo') {
                url = '/api/control/demo';
                body.secuencia_id = valor;
            }

            try {
                agregarLog(`📤 ENVIANDO COMANDO: ${tipo} - ${valor}...`);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    agregarLog(`✅ COMANDO EXITOSO: ${tipo} - ${valor}`);
                } else {
                    agregarLog(`❌ ERROR: Comando ${tipo} falló`);
                }
            } catch (error) {
                console.error('❌ Error:', error);
                agregarLog(`❌ ERROR DE CONEXIÓN: No se pudo enviar ${tipo}`);
            }
        }

        function simularObstaculo() {
            const distancia = (Math.random() * 100 + 10).toFixed(1);
            enviarComando('obstaculo', parseFloat(distancia));
        }

        async function verificarBackend() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('estadoBackend').innerHTML = 
                    '<i class="fas fa-check-circle"></i> <strong>ACTIVO</strong> - Puerto 5500';
                
                // Verificar BD
                const responseBD = await fetch('/api/dispositivos');
                const dispositivos = await responseBD.json();
                
                if (dispositivos.error) {
                    document.getElementById('estadoBD').innerHTML = 
                        '<i class="fas fa-times-circle"></i> <strong>ERROR BD</strong>';
                    agregarLog('❌ ERROR: Problema con la base de datos');
                } else {
                    document.getElementById('estadoBD').innerHTML = 
                        '<i class="fas fa-check-circle"></i> <strong>CONECTADA</strong> - SQLite';
                    agregarLog('🗄️ Base de datos: Conexión exitosa');
                    
                    if (dispositivos.length > 0) {
                        dispositivoId = dispositivos[0].dispositivo_id;
                        agregarLog(`📱 Dispositivo seleccionado: ${dispositivos[0].nombre}`);
                        agregarLog(`📍 Ubicación: ${dispositivos[0].ciudad}, ${dispositivos[0].pais}`);
                    } else {
                        agregarLog('⚠️ No hay dispositivos en la base de datos');
                    }
                }
                
            } catch (error) {
                document.getElementById('estadoBackend').innerHTML = 
                    '<i class="fas fa-times-circle"></i> <strong>ERROR</strong> - Servidor no responde';
                agregarLog('❌ ERROR: No se puede conectar al servidor backend');
            }
        }

        function agregarLog(mensaje) {
            const logDiv = document.getElementById('logEventos');
            const fecha = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.className = 'evento';
            logItem.innerHTML = `<small class="text-muted">[${fecha}]</small> ${mensaje}`;
            
            // Si es el primer mensaje (el de esperando), lo removemos
            if (logDiv.children.length === 1 && logDiv.children[0].classList.contains('text-center')) {
                logDiv.innerHTML = '';
            }
            
            logDiv.appendChild(logItem);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            // Limitar a 50 eventos
            if (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }

        // Inicializar
        verificarBackend();
    </script>
</body>
</html>
